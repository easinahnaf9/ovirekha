<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovirekha - Social Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            /* দ্বিতীয় ছবিটি (পেজের ব্যাকগ্রাউন্ড) যোগ করা হয়েছে */
            background: #f0f0f0; /* ফলব্যাক কালার */
            background-image: url('https://github.com/easinahnaf9/ovirekha/raw/main/2.jpg'); /* <--- দ্বিতীয় ছবির লিঙ্ক দিন */
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* স্ক্রল করলেও ছবিটি স্থির থাকবে */
            /* পুরাতন গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড সরিয়ে দেওয়া হয়েছে */
            
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
            position: relative; /* কাভার ইমেজ এবং প্রোফাইল ইমেজের জন্য */
            overflow: hidden; /* কাভার ইমেজের জন্য অতিরিক্ত অংশ লুকাতে */
        }
        
        .container:hover {
            transform: translateY(-5px);
        }
        
        /* Arrow 1 এর জন্য কাভার ইমেজ */
        .cover-image {
            height: 120px; /* কাভার ইমেজের উচ্চতা */
            background-image: url('https://github.com/easinahnaf9/ovirekha/raw/main/2.jpg'); /* <--- প্রথম ছবির লিঙ্ক দিন */
            background-size: cover;
            background-position: center;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            /* কন্টেইনারের প্যাডিং ওভাররাইড করার জন্য নেগেটিভ মার্জিন */
            margin: -35px -35px 20px -35px; 
            /* Arrow 1 এর উপরে সাদা জায়গা বাদ দেওয়ার জন্য */
            position: relative;
        }
        
        .profile-header {
            margin-bottom: 25px;
        }
        
        .profile-img {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            object-fit: cover;
            /* কাভার ইমেজের উপরে নিয়ে আসার জন্য পরিবর্তন */
            margin-bottom: 20px; 
            margin-top: -80px; /* ছবিটিকে কাভার ইমেজের উপর নিয়ে আসা হয়েছে */
            border: 4px solid #4a6bff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10; /* নিশ্চিত করতে উপরে থাকে */
        }
        
        /* ... বাকি CSS স্টাইল অপরিবর্তিত ... */

        h1 {
            margin: 0 0 8px;
            color: #222;
            font-size: 28px;
            font-weight: 700;
        }
        
        .title {
            color: #4a6bff;
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 0 10px;
        }
        
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: #fff;
            color: #333;
            padding: 16px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .social-btn:before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 5px;
            background: #4a6bff;
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }
        
        .social-btn:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .social-btn:hover:before {
            transform: scaleY(1);
        }
        
        .social-icon {
            margin-right: 15px;
            font-size: 24px;
            width: 30px;
            text-align: center;
        }
        
        .facebook { color: #1877f2; }
        .instagram { 
           background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .telegram { color: #1da1f2; }
        .gmail { color: #db4437; }
        .whatsapp { color: #25D366; }
        
        .gmail-btn {
            background: linear-gradient(to right, #f5f5f5, #fff);
            border: 1px solid #f1f1f1;
        }
        
        .email-text {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        footer {
            margin-top: 30px;
            color: #999;
            font-size: 15px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        
        .copyright {
            margin-top: 5px;
            font-size: 12px;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            .cover-image {
                margin: -25px -20px 20px -20px; /* ছোট স্ক্রিনের জন্য মার্জিন পরিবর্তন */
            }
            
            .profile-img {
                width: 150px;
                height: 150px;
                margin-top: -60px; /* ছোট স্ক্রিনের জন্য উপরে তোলা */
            }
            
            h1 {
                font-size: 24px;
            }
            
            .social-btn {
                padding: 14px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Arrow 1 এর জন্য কাভার ইমেজ -->
        <div class="cover-image"></div> 

        <div class="profile-header">
            <!-- Arrow 2 এর কাছে প্রোফাইল ইমেজ -->
            <img src="https://github.com/easinahnaf9/ovirekha/raw/main/FB_IMG_17659695459997419.jpg" alt="ovirekha" class="profile-img">
            <h1>অভিরেখা</h1>
    
            <p class="description">কাগজে আকি স্বপ্ন রেখা</div>
        
        <div class="social-links">
            <a href="https://www.facebook.com/ovirekha100" class="social-btn">
                <i class="fab fa-facebook social-icon facebook"></i>
                Facebook
            </a>
      
            <a href="https://wa.me/8801632315913?text=Hello%20I%20am%20contacting%20you"
               class="social-btn"
               target="_blank"
               rel="noopener">
                <i class="fab fa-whatsapp social-icon whatsapp"></i>
                WhatsApp
            </a>
            
            <a href="https://t.me/" class="social-btn">
                <i class="fab fa-telegram social-icon telegram"></i>
                Telegram
            </a>
            <a href="mailto:ovirekha100@gmail.com" class="social-btn gmail-btn">
                <i class="fab fa-google social-icon gmail"></i>
                Gmail
            </a>
        </div>
        
        <footer>
            Connect with me on social media
            <div class="copyright">© 2025 Ovirekha. All rights reserved.</div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.body.style.opacity = 1;
        });
        
        document.body.style.transition = 'opacity 0.5s ease';
        document.body.style.opacity = 0;
    </script>
</body>
</html>
